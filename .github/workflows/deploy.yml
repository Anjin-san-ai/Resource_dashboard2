name: Build & deploy BFF to Azure

# Builds the React SPA and deploys the Express BFF (which serves both /api and
# the built dist/) to a single Azure Linux App Service.
#
# Prerequisites (one-time):
#   - Infra provisioned via infra/main.bicep (see infra/deploy.md).
#   - Repo variable AZURE_WEBAPP_NAME = the Web App name from Bicep.
#   - Repo secret AZURE_WEBAPP_PUBLISH_PROFILE = the app's publish profile XML
#     (az webapp deployment list-publishing-profiles ... --xml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Use npm (not pnpm) here on purpose: npm produces a FLAT node_modules,
      # which survives the zip-deploy to App Service. pnpm's symlinked
      # node_modules breaks when zipped/extracted (packages can't be resolved).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SPA
        run: npm run build

      # Ship only runtime deps: drop devDependencies (vite, tailwind, esbuild…)
      # so the deployed package stays lean but self-contained.
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # The deploy step is skipped until Azure is configured: set the repo
      # variable AZURE_WEBAPP_NAME and the AZURE_WEBAPP_PUBLISH_PROFILE secret
      # and the next push deploys. Until then, pushes still build green.
      - name: Deploy to Azure Web App
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
