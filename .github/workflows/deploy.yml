name: Build & deploy BFF to Azure

# Builds the React SPA and deploys the Express BFF (which serves both /api and
# the built dist/) to a single Azure Linux App Service.
#
# Prerequisites (one-time):
#   - Infra provisioned via infra/main.bicep (see infra/deploy.md).
#   - A federated (OIDC) credential on an Entra app/service principal with
#     Contributor on the resource group, and these repo secrets set:
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   - Repo variable AZURE_WEBAPP_NAME = the Web App name from Bicep.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # for azure/login OIDC
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pnpm is the project's package manager (see README); it also side-steps
      # the npm reify bug noted in the README.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        # --no-frozen-lockfile so CI can resolve deps added since the committed
        # lockfile (e.g. the Azure SDKs) without failing on a lockfile mismatch.
        run: pnpm install --no-frozen-lockfile

      - name: Build SPA
        run: pnpm build

      # Ship only what the server needs at runtime: server code, built dist/,
      # package manifests, and production node_modules.
      - name: Prune to production dependencies
        run: pnpm prune --prod

      # The deploy steps are skipped until Azure is configured: set the repo
      # variable AZURE_WEBAPP_NAME (and the OIDC secrets) and the next push
      # deploys. Until then, pushes still build green.
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
